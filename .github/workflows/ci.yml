name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar herramientas
        run: pip install ruff mypy
      - name: Ruff
        run: ruff check mpc_forge tests
      - name: Formato
        run: ruff format --check mpc_forge tests
        continue-on-error: true
      - name: Mypy
        run: mypy mpc_forge --ignore-missing-imports
        continue-on-error: true

  test:
    name: Tests (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Ejecutar tests
        run: pytest -q --cov=mpc_forge --cov-report=xml --cov-report=term-missing
      - name: Subir cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  assets:
    name: Assets vendorizados al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run build:css
      - name: Comprobar que no hay cambios sin commitear
        run: |
          if ! git diff --quiet -- static/vendor; then
            echo "::error::static/vendor está desactualizado."
            echo "Ejecuta 'npm run vendor && npm run build:css' y commitea el resultado."
            git diff --stat -- static/vendor
            exit 1
          fi
          echo "static/vendor está al día."

  browser:
    name: Las páginas arrancan en un navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Arrancar el servidor
        run: |
          python -m uvicorn mpc_forge.app:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
      - name: Cliente API
        run: node scripts/check_api_client.mjs

      - name: Humo de arranque de la interfaz
        run: node scripts/check_pages_in_browser.mjs http://127.0.0.1:8000
