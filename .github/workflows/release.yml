name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests antes de publicar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio

      - name: Verificar dependencias
        shell: bash
        run: python -c "import sqlalchemy, fastapi, PIL, reportlab; print('deps OK')"

      - name: Tests
        shell: bash
        run: pytest -q

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset_suffix: windows
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset_suffix: macos-arm64
          - os: ubuntu-latest
            label: Linux
            asset_suffix: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Setup Node (para los assets vendorizados)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar assets locales
        shell: bash
        run: |
          npm ci
          npm run vendor
          npm run build:css

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --distpath packaging/dist \
            --workpath packaging/build \
            packaging/mpc-forge.spec

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "MPC-Forge-$version-${{ matrix.asset_suffix }}.zip"
          Compress-Archive `
            -Path "packaging/dist/MPC-Forge/*" `
            -DestinationPath "packaging/dist/$zipName" `
            -CompressionLevel Optimal
          echo "ASSET_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.zip"
          cd packaging/dist
          if [ -d "MPC Forge.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "MPC Forge.app" "$ASSET"
          else
            ditto -c -k --sequesterRsrc --keepParent "MPC-Forge" "$ASSET"
          fi
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.tar.gz"
          tar -czf "packaging/dist/${ASSET}" -C packaging/dist MPC-Forge
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Smoke test del binario
        shell: bash
        env:
          MPC_FORGE_PORT: '8791'
        run: |
          set -u
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="packaging/dist/MPC-Forge/MPC-Forge.exe"
          elif [ -d "packaging/dist/MPC Forge.app" ]; then
            BIN="packaging/dist/MPC Forge.app/Contents/MacOS/MPC-Forge"
          else
            BIN="packaging/dist/MPC-Forge/MPC-Forge"
          fi

          "$BIN" --no-browser --port 8791 > smoke.log 2>&1 &
          PID=$!

          OK=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::El binario terminó antes de aceptar conexiones."
              break
            fi
            if curl -sf "http://127.0.0.1:8791/" >/dev/null; then
              echo "El binario responde correctamente en el puerto 8791."
              OK=1
              break
            fi
            sleep 1
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "--- salida del binario ---"
          cat smoke.log || true

          if [ "$OK" != "1" ]; then
            echo "::error::El binario no respondió en 60s en el puerto 8791"
            exit 1
          fi

      - name: Upload as workflow artifact (siempre disponible)
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Forge-${{ matrix.asset_suffix }}
          path: packaging/dist/${{ env.ASSET_NAME }}
          retention-days: 30

      - name: Upload to GitHub Release (solo en push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/${{ env.ASSET_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
