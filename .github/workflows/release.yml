name: Release

# Se dispara cuando pusheas un tag v*, ej:
#   git tag v1.0.0 && git push origin v1.0.0
# También se puede lanzar manualmente desde la pestaña Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear la release y subir assets

jobs:
  # Gate de calidad: una release nunca debe publicarse con los tests en rojo.
  # Antes este workflow compilaba y publicaba sin ejecutar ni un test.
  test:
    name: Tests antes de publicar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # `shell: bash` explícito. En los runners de Windows el shell por defecto
      # es PowerShell, que NO aborta cuando falla un comando intermedio de un
      # bloque multilínea: solo cuenta el código de salida del último. Un fallo
      # del `pip install` del lockfile quedaba enmascarado por el `pip install
      # pytest` siguiente, el paso salía en VERDE, y el error real aparecía
      # después disfrazado de ModuleNotFoundError en pytest.
      #
      # `shell: bash` en Actions implica `set -eo pipefail`, así que el paso
      # falla en el primer comando que devuelva error.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio

      - name: Verificar dependencias
        # Comprobación barata y explícita: si el lockfile no llegó a aplicarse,
        # lo dice aquí con un mensaje claro en vez de salir enterrado en el
        # traceback de pytest.
        shell: bash
        run: python -c "import sqlalchemy, fastapi, PIL, reportlab; print('deps OK')"

      - name: Tests
        shell: bash
        run: pytest -q

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin fail-fast: si el build de macOS falla, el de Windows (que es la
      # plataforma principal de distribución) debe publicarse igualmente.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset_suffix: windows
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset_suffix: macos-arm64
          - os: ubuntu-latest
            label: Linux
            asset_suffix: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # `--require-hashes` contra el lockfile: dos builds del mismo tag
        # llevan exactamente las mismas versiones, y un paquete alterado en
        # PyPI no llega a una release.
        #
        # `shell: bash` para que un fallo aquí rompa el paso también en el
        # runner de Windows (ver la nota del job `test`).
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller

      - name: Setup Node (para los assets vendorizados)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar assets locales
        # static/vendor/ está versionado, pero lo regeneramos aquí para
        # garantizar que el .exe lleva un CSS coherente con los templates
        # actuales aunque alguien olvidara recompilarlo al hacer el commit.
        shell: bash
        run: |
          npm ci
          npm run vendor
          npm run build:css

      - name: Build with PyInstaller
        # "python -m PyInstaller" (misma razón que en build.ps1): más robusto
        # que llamar "pyinstaller" si Scripts/ no está en el PATH. La spec
        # detecta la plataforma sola (icono condicional, BUNDLE en macOS).
        # shell: bash en los tres runners para no duplicar el paso.
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --distpath packaging/dist \
            --workpath packaging/build \
            packaging/mpc-forge.spec

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "MPC-Forge-$version-${{ matrix.asset_suffix }}.zip"
          Compress-Archive `
            -Path "packaging/dist/MPC-Forge/*" `
            -DestinationPath "packaging/dist/$zipName" `
            -CompressionLevel Optimal
          echo "ASSET_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.zip"
          cd packaging/dist
          # `ditto` en lugar de `zip`: preserva los atributos extendidos del
          # .app, sin los cuales macOS lo trata como una carpeta y no se abre.
          if [ -d "MPC Forge.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "MPC Forge.app" "$ASSET"
          else
            ditto -c -k --sequesterRsrc --keepParent "MPC-Forge" "$ASSET"
          fi
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.tar.gz"
          # tar.gz en vez de zip: conserva el bit de ejecución, que zip pierde
          # y obligaría al usuario a hacer `chmod +x` a mano.
          tar -czf "packaging/dist/${ASSET}" -C packaging/dist MPC-Forge
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Smoke test del binario
        # Comprobación mínima de que arranca de verdad. El fallo clásico de
        # PyInstaller es compilar bien y morir al abrir por un hiddenimport
        # que falta: eso solo se ve ejecutándolo.
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="packaging/dist/MPC-Forge/MPC-Forge.exe"
          elif [ -d "packaging/dist/MPC Forge.app" ]; then
            BIN="packaging/dist/MPC Forge.app/Contents/MacOS/MPC-Forge"
          else
            BIN="packaging/dist/MPC-Forge/MPC-Forge"
          fi
          "$BIN" --no-browser --port 8791 &
          PID=$!
          for _ in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8791/ >/dev/null; then
              echo "El binario responde correctamente."
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::El binario no respondió en 45s"
          kill $PID || true
          exit 1

      - name: Upload as workflow artifact (siempre disponible)
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Forge-${{ matrix.asset_suffix }}
          path: packaging/dist/${{ env.ASSET_NAME }}
          retention-days: 30

      - name: Upload to GitHub Release (solo en push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/${{ env.ASSET_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
