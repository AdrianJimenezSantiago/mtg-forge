name: Release

# Cada push a main publica una release en cuanto el CI de ese commit termina en
# verde. La versión la calcula scripts/next_version.py a partir del último tag
# (semver: major solo si se pide, minor si se añade algo, patch en lo demás y
# nunca más allá de x.y.9). El tag se crea solo si los tres binarios compilan.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión (auto la deduce de los commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

# Las releases se calculan una detrás de otra para que los números no choquen.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Calcular versión
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Siguiente versión
        id: plan
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/next_version.py plan --ref HEAD --bump "$BUMP" > plan.json
          cat plan.json
          python - <<'PY'
          import json, os
          plan = json.load(open("plan.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"release={'true' if plan['release'] else 'false'}\n")
              out.write(f"sha={plan['sha']}\n")
              out.write(f"version={plan.get('version', '')}\n")
              out.write(f"tag={plan.get('tag', '')}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if plan["release"]:
                  summary.write(
                      f"### Release {plan['tag']}\n\n{plan['bump']} desde "
                      f"{plan['previous']} · {plan['commits']} commits\n"
                  )
              else:
                  summary.write(f"### Sin release\n\n{plan['reason']}\n")
          PY

  test:
    name: Tests antes de publicar
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio

      - name: Verificar dependencias
        shell: bash
        run: python -c "import sqlalchemy, fastapi, PIL, reportlab; print('deps OK')"

      - name: Tests
        shell: bash
        run: pytest -q

  build:
    name: Build ${{ matrix.label }}
    needs: [plan, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset_suffix: windows
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset_suffix: macos-arm64
          - os: ubuntu-latest
            label: Linux
            asset_suffix: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pyinstaller==6.22.3

      - name: Setup Node (para los assets vendorizados)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compilar assets locales
        shell: bash
        run: |
          npm ci
          npm run vendor
          npm run build:css

      - name: Sellar la versión en el código
        shell: bash
        run: python scripts/next_version.py stamp "${{ needs.plan.outputs.version }}"

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --distpath packaging/dist \
            --workpath packaging/build \
            packaging/mpc-forge.spec

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${{ needs.plan.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "MPC-Forge-$version-${{ matrix.asset_suffix }}.zip"
          Compress-Archive `
            -Path "packaging/dist/MPC-Forge/*" `
            -DestinationPath "packaging/dist/$zipName" `
            -CompressionLevel Optimal
          echo "ASSET_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.zip"
          cd packaging/dist
          if [ -d "MPC Forge.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "MPC Forge.app" "$ASSET"
          else
            ditto -c -k --sequesterRsrc --keepParent "MPC-Forge" "$ASSET"
          fi
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="MPC-Forge-${VERSION}-${{ matrix.asset_suffix }}.tar.gz"
          tar -czf "packaging/dist/${ASSET}" -C packaging/dist MPC-Forge
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Smoke test del binario
        shell: bash
        env:
          MPC_FORGE_PORT: '8791'
        run: |
          set -u
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="packaging/dist/MPC-Forge/MPC-Forge.exe"
          elif [ -d "packaging/dist/MPC Forge.app" ]; then
            BIN="packaging/dist/MPC Forge.app/Contents/MacOS/MPC-Forge"
          else
            BIN="packaging/dist/MPC-Forge/MPC-Forge"
          fi

          "$BIN" --no-browser --port 8791 > smoke.log 2>&1 &
          PID=$!

          OK=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::El binario terminó antes de aceptar conexiones."
              break
            fi
            if curl -sf "http://127.0.0.1:8791/" >/dev/null; then
              echo "El binario responde correctamente en el puerto 8791."
              OK=1
              break
            fi
            sleep 1
          done

          if [ "$OK" = "1" ]; then
            for path in /decks /static/js/core/boot.js /static/vendor/alpine.min.js \
                        /static/vendor/fonts/mana.woff2 /i18n/en.js /api/settings/ \
                        /api/calibration/sheet; do
              if ! curl -sf -o /dev/null "http://127.0.0.1:8791${path}"; then
                echo "::error::El binario no sirve ${path}"
                OK=0
              fi
            done
            if ! curl -sf "http://127.0.0.1:8791/api/drives/phash/stats" | grep -q '"available":true'; then
              echo "::error::pHash no está disponible en el binario"
              OK=0
            fi
          fi

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "--- salida del binario ---"
          cat smoke.log || true

          if [ "$OK" != "1" ]; then
            echo "::error::El binario no arrancó o no sirve todos sus recursos"
            exit 1
          fi

      - name: Upload as workflow artifact (siempre disponible)
        uses: actions/upload-artifact@v4
        with:
          name: MPC-Forge-${{ matrix.asset_suffix }}
          path: packaging/dist/${{ env.ASSET_NAME }}
          retention-days: 30

  publish:
    name: Publicar ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los binarios
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear tag y release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: 'true'
          draft: false
          prerelease: false
