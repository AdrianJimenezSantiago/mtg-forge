name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import the deck …
        2. Open PDF Studio …
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the sidebar (or "dev" when running from source).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows executable, macOS, Linux, From source]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Log → Download log, then paste the relevant lines.
      render: text
