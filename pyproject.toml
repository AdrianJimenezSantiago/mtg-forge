[project]
name = "mpc-forge"
version = "0.1.0"
description = "Local-first Magic: The Gathering proxy printing workflow — decklist to print-ready PDF or MPC Autofill XML"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cloudscraper>=1.2.71",
    "aiofiles>=24.1",
    "platformdirs>=4.3",
    "python-slugify>=8.0",
    "truststore>=0.10",
    "reportlab>=4.2",
    "rapidfuzz>=3.9",
    "Pillow>=10.0",
    # Optional at runtime (features degrade gracefully without them), but
    # installed by default to match requirements.txt.
    "imagehash>=4.3",   # cross-drive perceptual-hash dedupe
    "ijson>=3.3",       # faster Scryfall bulk-data parsing
]

[project.optional-dependencies]
window = ["pywebview>=5.3"]
build = ["pyinstaller>=6.10"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # ya está arriba pero explicitamos por si dev se instala sin main
]

[project.scripts]
mpc-forge = "mpc_forge.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true

[tool.pytest.ini_options]
# asyncio_mode = "auto" hace que los tests async no necesiten @pytest.mark.asyncio
# individual — evita boilerplate en cada test. En modo "strict" tendrías que
# decorar cada uno; "auto" es más cómodo para una suite de este tamaño.
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Silencia warnings de deprecation de librerías externas — ruido que no
# aporta al developer. Los nuestros propios sí queremos verlos.
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:starlette.*",
]
