[project]
name = "mpc-forge"
version = "0.1.0"
description = "Local-first Magic: The Gathering proxy printing workflow — decklist to print-ready PDF or MPC Autofill XML"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cloudscraper>=1.2.71",
    "aiofiles>=24.1",
    "platformdirs>=4.3",
    "python-slugify>=8.0",
    "truststore>=0.10",
    "reportlab>=4.2",
    "rapidfuzz>=3.9",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "ijson>=3.3",
]

[project.optional-dependencies]
window = ["pywebview>=5.3"]
build = ["pyinstaller>=6.10"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
mpc-forge = "mpc_forge.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "DTZ",
    "LOG", "G",
    "S",
    "SIM",
    "PERF",
    "RUF",
]

ignore = [
    "S101",
    "BLE001",
    "S110",
    "E501",
    "S311",
    "RUF001", "RUF002", "RUF003",
    "E402",
    "S608",
]

[tool.ruff.lint.extend-per-file-ignores]
"mpc_forge/**" = ["SIM105", "PERF401", "SIM102", "S318", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105", "S106", "S108", "S603", "S607",
    "DTZ001", "DTZ005", "PERF", "B", "RUF012", "RUF007", "F841",
]
"mpc_forge/services/i18n.py" = ["E241", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:starlette.*",
]
