<!DOCTYPE html>
<html lang="{{ lang | default('es') }}" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MPC Forge{% endblock %}</title>

  <link rel="icon" type="image/png" href="/static/img/favicon.png?v={{ asset_v('img/favicon.png') }}">

  <link rel="stylesheet" href="/static/vendor/tailwind.css?v={{ asset_v('vendor/tailwind.css') }}">


  <script defer src="/static/vendor/lucide.min.js?v={{ asset_v('vendor/lucide.min.js') }}"></script>

  <script defer src="/static/vendor/alpine-collapse.min.js?v={{ asset_v('vendor/alpine-collapse.min.js') }}"></script>
  <script defer src="/static/vendor/alpine-focus.min.js?v={{ asset_v('vendor/alpine-focus.min.js') }}"></script>
  <script defer src="/static/vendor/auto-animate.min.js?v={{ asset_v('vendor/auto-animate.min.js') }}"></script>
  <script defer src="/static/js/core/api.js?v={{ asset_v('js/core/api.js') }}"></script>
  <script defer src="/static/js/core/shell.js?v={{ asset_v('js/core/shell.js') }}"></script>

  {% block view_module %}{% endblock %}

  <script defer src="/static/vendor/alpine.min.js?v={{ asset_v('vendor/alpine.min.js') }}"></script>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v('css/app.css') }}">
  <link rel="stylesheet" href="/static/css/motion.css?v={{ asset_v('css/motion.css') }}">
  {% block extra_head %}{% endblock %}

  <link rel="expect" href="#app-content-end" blocking="render">
  <script>
    (function () {
      var root = document.documentElement;

      try {
        if (localStorage.getItem('mpc-ambient') === 'off') root.classList.add('fx-ambient-off');
      } catch (_) {}

      try {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduce && location.pathname === '/decks') {
          var navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          if ((navEntry && navEntry.type === 'reload') || !sessionStorage.getItem('mpc-dealt')) {
            root.classList.add('fx-dealing');
            setTimeout(function () { root.classList.remove('fx-dealing'); }, 2000);
          }
        }
      } catch (_) {}

      var DECK_PATH = /^\/decks\/(\d+)\/?$/;
      var deckIdFromUrl = function (url) {
        try {
          var m = DECK_PATH.exec(new URL(url, location.href).pathname);
          return m ? m[1] : null;
        } catch (_) { return null; }
      };
      var nameCover = function (id, transition) {
        var cover = id && document.querySelector('[data-deck-cover="' + id + '"]');
        if (!cover) return;
        cover.style.viewTransitionName = 'deck-cover';
        transition.finished.finally(function () { cover.style.viewTransitionName = ''; });
      };
      window.addEventListener('pageswap', function (e) {
        if (e.viewTransition && e.activation && e.activation.entry) {
          nameCover(deckIdFromUrl(e.activation.entry.url), e.viewTransition);
        }
      });
      window.addEventListener('pagereveal', function (e) {
        document.querySelectorAll('[data-deck-cover]').forEach(function (el) {
          el.style.viewTransitionName = '';
        });
        var from = window.navigation && window.navigation.activation && window.navigation.activation.from;
        if (e.viewTransition && from) {
          nameCover(deckIdFromUrl(from.url), e.viewTransition);
        }
      });
    })();
  </script>
</head>

<body class="bg-bg-base text-fg antialiased min-h-screen font-sans">
  <div class="fx-ambient-layer" aria-hidden="true">
    <canvas class="fx-aurora"></canvas>
    <canvas class="fx-ambient"></canvas>
  </div>
  <script src="/static/js/core/ambient.js?v={{ asset_v('js/core/ambient.js') }}"></script>

  <div class="app-shell flex min-h-screen">

    {% include "partials/shell/sidebar.html" %}

    <main class="flex-1 overflow-x-hidden">
      {% block content %}{% endblock %}
      <div id="app-content-end" hidden></div>
    </main>
  </div>

  {% include "partials/shell/toasts.html" %}

  {% include "partials/shell/confirm_dialog.html" %}

  <script src="/i18n/{{ lang | default('es') }}.js?v={{ i18n_v() }}"></script>

  <script src="/static/js/core/app.js?v={{ asset_v('js/core/app.js') }}"></script>
  <script src="/static/js/core/motion.js?v={{ asset_v('js/core/motion.js') }}"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
