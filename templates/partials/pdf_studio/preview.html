<section class="overflow-auto bg-bg-base relative" x-ref="canvasScroll">

  <div class="sticky top-0 z-10 bg-bg-inset/95 backdrop-blur border-b border-border-subtle
              px-4 py-2 flex items-center gap-4 text-xs">
    <div class="font-mono text-fg-muted">
      <span class="text-fg" x-text="totalPages"></span>
      <span>{{ t.pdf_page_section | lower }}s</span>
    </div>

    <div class="h-4 w-px bg-border-subtle"></div>

    <div class="flex items-center gap-2 text-fg-muted">
      <span class="text-[10px] uppercase tracking-wider">{{ t.pdf_zoom }}</span>
      <input type="range" min="20" max="150" step="5" x-model.number="zoom" aria-label="{{ t.pdf_zoom }}"
             class="w-32 accent-accent">
      <span class="font-mono text-fg w-10 text-right"><span x-text="zoom"></span>%</span>
    </div>

    <div class="h-4 w-px bg-border-subtle"></div>

    <label class="flex items-center gap-1.5 text-fg-muted cursor-pointer">
      <input type="checkbox" x-model="showPageMargins" class="accent-accent">
      {{ t.pdf_page_margins }}
    </label>

    <div class="flex-1"></div>

    <button @click="openGuide()"
            class="inline-flex items-center gap-1.5 px-2 py-1 rounded text-[11px]
                   text-fg-muted hover:text-accent hover:bg-bg-subtle transition
                   border border-transparent hover:border-border-subtle"
            title="{{ t.pdf_guide }}">
      <i data-lucide="circle-help" class="w-3.5 h-3.5"></i>
      {{ t.pdf_guide }}
    </button>

    <span class="font-mono text-fg-faint text-[11px]" x-show="deck">
      <span x-text="opts.backs_layout === 'duplex' && opts.include_backs ? '{{ t.pdf_duplex_intercalado }}' : '{{ t.pdf_solo_fronts }}'"></span>
    </span>
  </div>

  <div class="p-6 flex flex-col items-center gap-6">
    <div x-show="!deck" class="text-center py-16 text-fg-faint">{{ t.pdf_loading_deck }}</div>

    <div x-show="deck && totalPages === 0" class="text-center py-16 text-fg-faint">
      <p class="text-sm">{{ t.pdf_no_active_cards }}</p>
      <a :href="`/decks/${deckId}`" class="text-accent hover:text-accent-glow text-xs mt-2 inline-block">
        ← Volver al editor
      </a>
    </div>

    <template x-for="(page, idx) in allPages" :key="page.key">
      <div class="flex flex-col items-center gap-1.5">
        <div class="text-[10px] uppercase tracking-wider text-fg-faint font-mono">
          Hoja <span x-text="idx + 1"></span>
          <span class="text-fg-faint/70">·</span>
          <span x-text="page.kind === 'back' ? '{{ t.pdf_page_backs }}' + (page.mirror ? ' {{ t.pdf_page_backs_mirrored | replace(t.pdf_page_backs + " ", "") }}' : '') : '{{ t.pdf_page_fronts }}'"></span>
        </div>
        <div class="shadow-modal rounded-sm bg-white overflow-hidden preview-page"
             :style="`width: ${geomForKind(page.kind).page_w_mm * pxPerMm}px;
                      height: ${geomForKind(page.kind).page_h_mm * pxPerMm}px;`"
             @click="onPreviewClick($event)"
             x-html="svgMarkupForPage(page)"></div>
      </div>
    </template>
  </div>
</section>
