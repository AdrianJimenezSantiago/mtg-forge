<div x-data="whatsNew()" x-init="check()">
  <template x-if="info">
    <div class="fixed inset-0 z-[90] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
         @click.self="close()" @keydown.escape.window="close()">
      <div class="bg-bg-elevated border border-border-strong rounded-xl shadow-modal w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden"
           role="dialog" aria-modal="true" aria-labelledby="whats-new-title" x-trap="true">
        <div class="flex items-center justify-between px-5 py-3 border-b border-border-subtle">
          <h2 id="whats-new-title" class="font-semibold flex items-center gap-2">
            <i data-lucide="party-popper" class="w-4 h-4 text-accent"></i>
            <span x-text="window._T.whats_new_title.replace('{version}', info.version)"></span>
          </h2>
          <button type="button" aria-label="{{ t.common_close }}" @click="close()" class="text-fg-faint hover:text-fg p-1">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 text-sm text-fg-muted">
          <p class="text-xs text-fg-faint mb-3" x-text="window._T.whats_new_from.replace('{previous}', info.previous)"></p>
          <template x-if="info.notes">
            <div class="whitespace-pre-line leading-relaxed" x-text="info.notes"></div>
          </template>
          <template x-if="!info.notes">
            <p>{{ t.whats_new_offline }}</p>
          </template>
        </div>
        <div class="px-5 py-3 border-t border-border-subtle flex items-center justify-between">
          <a :href="info.url" target="_blank" rel="noopener noreferrer" class="text-xs text-accent hover:text-accent-glow">{{ t.whats_new_release_page }} ↗</a>
          <button type="button" @click="close()" class="bg-accent text-bg-base text-sm font-medium px-4 py-1.5 rounded-md">{{ t.whats_new_ok }}</button>
        </div>
      </div>
    </div>
  </template>
</div>
