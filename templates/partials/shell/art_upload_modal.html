<div x-data>
<template x-if="$store.artUpload.open">
  <div class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
       @click.self="$store.artUpload.close()"
       @keydown.escape.window="$store.artUpload.close()"
       @dragover.prevent="$store.artUpload.dragOver = true"
       @dragleave.self="$store.artUpload.dragOver = false"
       @drop.prevent="$store.artUpload.onDrop($event)">
    <div class="relative bg-bg-elevated border border-border-strong rounded-2xl shadow-modal animate-scale-in
                w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden"
         role="dialog" aria-modal="true" aria-labelledby="art-upload-title" x-trap.noscroll="true">

      <div class="flex items-center justify-between gap-4 px-5 py-3 border-b border-border-subtle shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-full bg-accent/10 text-accent flex items-center justify-center shrink-0">
            <i data-lucide="image-plus" class="w-4 h-4"></i>
          </div>
          <div class="min-w-0">
            <h2 id="art-upload-title" class="text-[10px] uppercase tracking-widest text-fg-faint"
                x-text="$store.artUpload.title || window._T.art_upload_title"></h2>
            <div class="font-display text-lg text-accent-glow truncate" x-text="$store.artUpload.displayName || $store.artUpload.cardName"></div>
          </div>
        </div>
        <button type="button" @click="$store.artUpload.close()" :disabled="$store.artUpload.uploading"
                class="shrink-0 text-fg-muted hover:text-fg p-2 rounded hover:bg-bg-subtle transition disabled:opacity-40"
                aria-label="{{ t.common_close }}">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <input type="file" x-ref="artUploadInput" class="hidden" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"
             aria-label="{{ t.art_upload_choose }}"
             @change="$store.artUpload.pick($event.target.files[0]); $event.target.value = ''">

      <div class="flex-1 min-h-0 overflow-y-auto p-5">

        <template x-if="!$store.artUpload.file">
          <button type="button" @click="$refs.artUploadInput.click()"
                  class="w-full min-h-[320px] rounded-xl border-2 border-dashed flex flex-col items-center justify-center gap-3
                         px-6 py-10 text-center transition"
                  :class="$store.artUpload.dragOver
                          ? 'border-accent bg-accent/10 text-accent'
                          : 'border-border-strong text-fg-muted hover:border-accent/60 hover:bg-bg-subtle/60'">
            <i data-lucide="upload" class="w-10 h-10"></i>
            <span class="text-base font-medium text-fg">{{ t.art_upload_drop_here }}</span>
            <span class="text-sm">{{ t.art_upload_drop_hint }}</span>
            <span class="text-[11px] text-fg-faint mt-2">{{ t.art_upload_requirements }}</span>
          </button>
        </template>

        <template x-if="$store.artUpload.file">
          <div class="grid gap-6 md:grid-cols-[minmax(0,1fr)_300px]">

            <div class="space-y-3">
              <div class="flex items-end justify-center gap-6 rounded-xl bg-bg-inset/60 border border-border-subtle p-5 relative"
                   :class="$store.artUpload.dragOver ? 'ring-2 ring-accent' : ''">
                <template x-if="$store.artUpload.currentImage">
                  <figure class="w-[38%] max-w-[190px] space-y-1.5">
                    <div class="aspect-[63/88] rounded-[4.8%] overflow-hidden bg-bg-base border border-border-subtle opacity-80">
                      <img :src="$store.artUpload.currentImage" alt="{{ t.art_upload_current }}"
                           class="w-full h-full object-cover">
                    </div>
                    <figcaption class="text-center text-[10px] uppercase tracking-wider text-fg-muted">{{ t.art_upload_current }}</figcaption>
                  </figure>
                </template>
                <template x-if="$store.artUpload.currentImage">
                  <i data-lucide="arrow-right" class="w-5 h-5 text-fg-faint self-center shrink-0"></i>
                </template>
                <figure class="w-[52%] max-w-[260px] space-y-1.5">
                  <div class="aspect-[63/88] rounded-[4.8%] overflow-hidden bg-black border border-accent/50 shadow-glow relative">
                    <template x-if="$store.artUpload.previewUrl">
                      <img :src="$store.artUpload.previewUrl" alt="{{ t.art_upload_new }}"
                           class="w-full h-full" :style="`object-fit: ${$store.artUpload.objectFit}`">
                    </template>
                    <template x-if="!$store.artUpload.previewUrl">
                      <div class="w-full h-full flex items-center justify-center text-fg-faint">
                        <span x-show="$store.artUpload.reading" class="spinner-ring"></span>
                        <i x-show="!$store.artUpload.reading" data-lucide="image-off" class="w-8 h-8"></i>
                      </div>
                    </template>
                    <div x-show="$store.artUpload.showGuides && $store.artUpload.previewUrl"
                         class="absolute pointer-events-none border border-dashed border-white/70 rounded-[3%]
                                inset-x-[4.8%] inset-y-[3.4%]"
                         title="{{ t.art_upload_safe_zone }}"></div>
                  </div>
                  <figcaption class="text-center text-[10px] uppercase tracking-wider text-accent">{{ t.art_upload_new }}</figcaption>
                </figure>
              </div>
              <div class="flex items-center justify-between gap-3 text-[11px] text-fg-faint">
                <label class="flex items-center gap-1.5 cursor-pointer hover:text-fg-muted">
                  <input type="checkbox" x-model="$store.artUpload.showGuides" class="accent-accent w-3 h-3">
                  {{ t.art_upload_safe_zone }}
                </label>
                <span>{{ t.art_upload_preview_hint }}</span>
              </div>
            </div>

            <div class="space-y-4 text-sm">
              <template x-if="$store.artUpload.info">
                <div class="rounded-lg bg-bg-subtle border border-border-subtle px-3 py-2 space-y-0.5">
                  <div class="text-fg truncate font-medium" x-text="$store.artUpload.info?.name" :title="$store.artUpload.info?.name"></div>
                  <div class="text-[11px] text-fg-faint font-mono">
                    <span x-show="$store.artUpload.info?.width"
                          x-text="`${$store.artUpload.info?.width}×${$store.artUpload.info?.height} px · `"></span>
                    <span x-text="$store.artUpload.info?.type"></span>
                    · <span x-text="($store.artUpload.info?.bytes / 1048576).toFixed(2) + ' MB'"></span>
                  </div>
                </div>
              </template>

              <ul class="space-y-1.5" aria-live="polite">
                <template x-for="(c, i) in $store.artUpload.checks" :key="i + c.text">
                  <li class="flex items-start gap-2 text-[12px] leading-snug"
                      :class="{ 'text-success': c.level === 'ok', 'text-warning': c.level === 'warn', 'text-danger': c.level === 'error' }">
                    <i x-show="c.level === 'ok'" data-lucide="check-circle-2" class="w-3.5 h-3.5 shrink-0 mt-px"></i>
                    <i x-show="c.level === 'warn'" data-lucide="alert-triangle" class="w-3.5 h-3.5 shrink-0 mt-px"></i>
                    <i x-show="c.level === 'error'" data-lucide="x-circle" class="w-3.5 h-3.5 shrink-0 mt-px"></i>
                    <span x-text="c.text"></span>
                  </li>
                </template>
              </ul>

              <template x-if="$store.artUpload.info && !$store.artUpload.blocking && !$store.artUpload.ratioOk">
                <fieldset class="space-y-1.5">
                  <legend class="text-[10px] uppercase tracking-wider text-fg-faint mb-1.5">{{ t.art_upload_fit }}</legend>
                  <template x-for="opt in [
                    {v: 'crop',    l: window._T.art_upload_fit_crop,    d: window._T.art_upload_fit_crop_desc},
                    {v: 'contain', l: window._T.art_upload_fit_contain, d: window._T.art_upload_fit_contain_desc},
                    {v: 'stretch', l: window._T.art_upload_fit_stretch, d: window._T.art_upload_fit_stretch_desc},
                  ]" :key="opt.v">
                    <label class="flex items-start gap-2 rounded-md border px-2.5 py-2 cursor-pointer transition"
                           :class="$store.artUpload.fit === opt.v ? 'border-accent bg-accent/10' : 'border-border-subtle hover:bg-bg-subtle'">
                      <input type="radio" name="art-upload-fit" :value="opt.v" :checked="$store.artUpload.fit === opt.v"
                             @change="$store.artUpload.setFit(opt.v)" class="accent-accent w-3 h-3 mt-1">
                      <span class="min-w-0">
                        <span class="block text-[12px] text-fg font-medium" x-text="opt.l"></span>
                        <span class="block text-[11px] text-fg-faint leading-snug" x-text="opt.d"></span>
                      </span>
                    </label>
                  </template>
                </fieldset>
              </template>

              <template x-if="$store.artUpload.faces.length > 1">
                <div>
                  <label for="art-upload-face" class="block text-[10px] uppercase tracking-wider text-fg-faint mb-1">{{ t.art_upload_face }}</label>
                  <select id="art-upload-face" x-model="$store.artUpload.face"
                          class="w-full bg-bg-subtle border border-border-subtle rounded px-2 py-1.5 text-sm focus:outline-none focus:border-accent">
                    <template x-for="f in $store.artUpload.faces" :key="f.value">
                      <option :value="f.value" x-text="f.label" :selected="f.value === $store.artUpload.face"></option>
                    </template>
                  </select>
                </div>
              </template>

              <div>
                <label for="art-upload-variant" class="block text-[10px] uppercase tracking-wider text-fg-faint mb-1">{{ t.art_upload_variant }}</label>
                <input id="art-upload-variant" type="text" maxlength="60" x-model="$store.artUpload.variant"
                       @keydown.enter.prevent="$store.artUpload.upload()"
                       placeholder="{{ t.art_upload_variant_placeholder }}"
                       class="w-full bg-bg-subtle border border-border-subtle rounded px-2 py-1.5 text-sm focus:outline-none focus:border-accent">
                <p class="text-[10px] text-fg-faint mt-1 leading-snug">{{ t.art_upload_variant_hint }}</p>
              </div>

              <template x-if="$store.artUpload.error">
                <div role="alert" class="text-[12px] text-danger bg-danger-bg/60 border border-danger-border rounded-md px-3 py-2 flex items-start gap-2">
                  <i data-lucide="x-circle" class="w-3.5 h-3.5 shrink-0 mt-px"></i>
                  <span x-text="$store.artUpload.error"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <div class="px-5 py-3 border-t border-border-subtle bg-bg-inset flex flex-wrap items-center justify-between gap-2 shrink-0">
        <div class="text-[11px] text-fg-faint">
          <kbd class="bg-bg-subtle border border-border-subtle rounded px-1">Ctrl+V</kbd> {{ t.art_upload_paste_hint }}
        </div>
        <div class="flex items-center gap-2">
          <button type="button" x-show="$store.artUpload.file" @click="$refs.artUploadInput.click()"
                  :disabled="$store.artUpload.uploading"
                  class="px-3 py-2 rounded-md text-sm text-fg-muted hover:text-fg hover:bg-bg-subtle transition
                         inline-flex items-center gap-1.5 disabled:opacity-40">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            {{ t.art_upload_change_file }}
          </button>
          <button type="button" @click="$store.artUpload.close()" :disabled="$store.artUpload.uploading"
                  class="px-4 py-2 rounded-md text-sm text-fg-muted hover:text-fg hover:bg-bg-subtle transition font-medium disabled:opacity-40">
            {{ t.common_cancel }}
          </button>
          <button type="button" @click="$store.artUpload.upload()" :disabled="!$store.artUpload.canUpload"
                  class="px-4 py-2 rounded-md text-sm font-medium bg-accent text-bg-base hover:bg-accent-glow transition
                         inline-flex items-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
            <i x-show="!$store.artUpload.uploading" data-lucide="upload" class="w-4 h-4"></i>
            <span x-show="$store.artUpload.uploading" class="spinner-ring spinner-ring--sm"></span>
            <span x-text="$store.artUpload.uploading
                            ? window._T.art_upload_uploading
                            : ($store.artUpload.deckCardId != null ? window._T.art_upload_submit_use : window._T.art_upload_submit)"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</template>
</div>
