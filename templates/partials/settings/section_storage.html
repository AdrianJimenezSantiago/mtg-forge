<div x-show="!searchQuery && activeSection === 'storage' && !loading" x-cloak class="space-y-4">

  <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4">
    <div class="flex items-center gap-2">
      <i data-lucide="hard-drive" class="w-4 h-4 text-accent"></i>
      <h2 class="font-medium">{{ t.storage_title }}</h2>
      <button @click="loadStorage(true)"
              :disabled="storageLoading"
              class="ml-auto text-[11px] text-fg-faint hover:text-fg flex items-center gap-1 disabled:opacity-50">
        <i data-lucide="refresh-cw" class="w-3 h-3" :class="storageLoading ? 'animate-spin' : ''"></i>
        <span x-text="storageLoading ? '{{ t.storage_calculating }}' : '{{ t.storage_recalculate }}'"></span>
      </button>
    </div>
    <p class="text-sm text-fg-muted">{{ t.storage_desc }}</p>

    <template x-if="storageError">
      <div class="text-xs bg-danger-bg border border-danger-border text-danger rounded-lg p-3"
           x-text="storageError"></div>
    </template>

    <template x-if="storageLoading && !storage">
      <div class="text-center py-8 text-fg-faint text-sm">
        <i data-lucide="loader-2" class="w-4 h-4 mx-auto mb-2 animate-spin"></i>
        {{ t.storage_calculating }}
      </div>
    </template>

    <template x-if="storage">
      <div class="space-y-4">
        <div>
          <div class="flex items-end justify-between gap-3 mb-2">
            <div>
              <div class="text-[11px] uppercase tracking-wider text-fg-faint">{{ t.storage_total }}</div>
              <div class="text-2xl font-display font-semibold leading-none mt-1"
                   x-text="fmtBytes(storage.totals.bytes)"></div>
            </div>
            <div class="text-[11px] text-fg-faint text-right">
              <span x-text="storage.totals.files.toLocaleString()"></span> {{ t.storage_files }}
              <template x-if="storage.totals.reclaimable_bytes > 0">
                <div>
                  {{ t.storage_reclaimable }}:
                  <span class="text-fg-muted" x-text="fmtBytes(storage.totals.reclaimable_bytes)"></span>
                </div>
              </template>
            </div>
          </div>
          <div class="flex h-2.5 rounded-full overflow-hidden bg-bg-subtle">
            <template x-for="cat in storageRows" :key="'bar-' + cat.key">
              <div :style="{width: storagePct(cat.bytes) + '%', background: kindColor(cat.kind)}"
                   :title="catLabel(cat.key)"></div>
            </template>
          </div>
        </div>

        <template x-if="storage.totals.bytes === 0">
          <div class="text-center py-6 text-fg-faint text-sm border border-dashed border-border-subtle rounded-xl">
            {{ t.storage_empty }}
          </div>
        </template>

        <div>
          <template x-for="cat in storageRows" :key="cat.key">
            <div class="flex items-start gap-3 py-2.5 border-t border-border-subtle/40">
              <span class="w-1.5 h-1.5 rounded-full mt-2 shrink-0"
                    :style="{background: kindColor(cat.kind)}"></span>
              <div class="min-w-0 flex-1">
                <div class="text-sm font-medium" x-text="catLabel(cat.key)"></div>
                <div class="text-[11px] text-fg-muted" x-text="catDesc(cat.key)"></div>
                <div class="text-[10px] text-fg-faint font-mono break-all mt-0.5" x-text="cat.path"></div>
                <template x-if="!cat.exists">
                  <div class="text-[10px] text-fg-faint italic">{{ t.storage_path_missing }}</div>
                </template>
              </div>
              <div class="text-right shrink-0">
                <div class="text-sm font-mono" x-text="fmtBytes(cat.bytes)"></div>
                <div class="text-[10px] text-fg-faint">
                  <span x-text="cat.files.toLocaleString()"></span> {{ t.storage_files }}
                </div>
                <div class="text-[10px]" :style="{color: kindColor(cat.kind)}"
                     x-text="kindLabel(cat.kind)"></div>
              </div>
            </div>
          </template>
        </div>

        <div class="pt-3 border-t border-border-subtle text-xs text-fg-muted space-y-1">
          <div class="flex items-start gap-1.5">
            <i data-lucide="archive" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i>
            <span x-text="backupsStoredText()"></span>
          </div>
          <div class="flex items-start gap-1.5">
            <i data-lucide="info" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i>
            <span x-text="backupEstimateText()"></span>
          </div>
        </div>
      </div>
    </template>
  </div>

  <template x-if="storage && storage.volumes.length">
    <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4">
      <div class="flex items-center gap-2">
        <i data-lucide="database" class="w-4 h-4 text-accent"></i>
        <h2 class="font-medium">{{ t.storage_disk_title }}</h2>
      </div>
      <template x-for="vol in storage.volumes" :key="vol.mount">
        <div class="space-y-1.5">
          <div class="flex items-center justify-between gap-3 text-xs">
            <span class="font-mono text-fg-muted break-all" x-text="vol.mount"></span>
            <span class="text-fg-faint shrink-0" x-text="diskFreeText(vol)"></span>
          </div>
          <div class="relative h-2 rounded-full bg-bg-subtle overflow-hidden">
            <div class="absolute inset-y-0 left-0 bg-border-strong"
                 :style="{width: diskUsedPct(vol) + '%'}"></div>
            <div class="absolute inset-y-0 left-0 bg-accent"
                 :style="{width: (vol.total_bytes ? vol.app_bytes * 100 / vol.total_bytes : 0) + '%'}"></div>
          </div>
          <div class="text-[11px] text-fg-faint" x-text="diskShareText(vol)"></div>
        </div>
      </template>
    </div>
  </template>

  <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4">
    <div class="flex items-center gap-2">
      <i data-lucide="trash-2" class="w-4 h-4 text-accent"></i>
      <h2 class="font-medium">{{ t.storage_cleanup_title }}</h2>
    </div>
    <p class="text-sm text-fg-muted">{{ t.storage_cleanup_desc }}</p>

    <template x-if="storage && storagePurgeable.length === 0">
      <div class="text-xs text-fg-faint">{{ t.storage_cleanup_nothing }}</div>
    </template>

    <template x-for="cat in storagePurgeable" :key="'purge-' + cat.key">
      <div class="flex items-center gap-3 py-2 border-t border-border-subtle/40">
        <div class="min-w-0 flex-1">
          <div class="text-sm" x-text="catLabel(cat.key)"></div>
          <div class="text-[11px] text-fg-muted" x-text="kindLabel(cat.kind)"></div>
          <template x-if="cat.key === 'backups'">
            <div class="text-[11px] text-fg-faint">{{ t.storage_backups_keep }}</div>
          </template>
          <template x-if="cat.key === 'exports'">
            <label class="mt-1 flex items-center gap-1.5 text-[11px] text-fg-faint cursor-pointer">
              <input type="checkbox" x-model="exportsKeepRecent"
                     class="accent-accent w-3 h-3">
              {{ t.storage_exports_recent }}
            </label>
          </template>
        </div>
        <div class="text-sm font-mono text-fg-muted shrink-0" x-text="fmtBytes(cat.bytes)"></div>
        <button @click="purgeStorage(cat.purge_target)"
                :disabled="storagePurging !== ''"
                class="text-xs bg-bg-subtle hover:bg-danger-bg border border-border-strong hover:border-danger-border
                       text-fg-muted hover:text-danger px-3 py-1.5 rounded-md transition
                       disabled:opacity-50 flex items-center gap-1.5 shrink-0">
          <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"
             x-show="storagePurging === cat.purge_target"></i>
          <span x-text="storagePurging === cat.purge_target
                        ? '{{ t.storage_cleanup_working }}'
                        : '{{ t.storage_cleanup_btn }}'"></span>
        </button>
      </div>
    </template>
  </div>
</div>
