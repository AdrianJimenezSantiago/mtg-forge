<div x-show="!searchQuery && activeSection === 'log' && !loading" x-cloak class="space-y-4">
  <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4"
       x-data="debugLogPanel()" x-init="load()">
    <div class="flex items-center gap-2">
      <i data-lucide="file-text" class="w-4 h-4 text-accent"></i>
      <h2 class="font-medium">{{ t.settings_debug_log }}</h2>
      <span class="ml-auto flex items-center gap-1.5 text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full"
              :class="info.exists ? 'bg-warning' : 'bg-fg-faint'"></span>
        <span :class="info.exists ? 'text-warning' : 'text-fg-faint'"
              x-text="info.exists ? '{{ t.settings_log_active }}' : '{{ t.settings_log_none }}'"></span>
      </span>
    </div>
    <p class="text-sm text-fg-muted">
      {{ t.settings_backup_desc }}
    </p>

    <template x-if="info.exists">
      <div class="text-xs bg-bg-subtle border border-border-subtle rounded-lg p-3 space-y-1">
        <div class="flex items-start gap-2">
          <span class="text-fg-faint shrink-0 w-14">{{ t.settings_log_path }}:</span>
          <span class="text-fg-muted font-mono break-all" x-text="info.path"></span>
        </div>
        <div class="flex items-start gap-2">
          <span class="text-fg-faint shrink-0 w-14">{{ t.settings_log_size }}:</span>
          <span class="text-fg-muted font-mono" x-text="(info.size_bytes / 1024).toFixed(1) + ' KB'"></span>
        </div>
      </div>
    </template>
    <template x-if="!info.exists">
      <div class="text-xs text-fg-faint italic">{{ t.settings_log_none_msg }}</div>
    </template>

    <div class="flex flex-wrap items-center gap-2 pt-1">
      <a :href="info.exists ? '/api/debug/log/download' : '#'"
         :class="info.exists ? '' : 'opacity-40 pointer-events-none'"
         class="bg-warning-bg hover:bg-warning-bg border border-warning-border text-warning
                text-sm font-medium px-3 py-2 rounded-md transition flex items-center gap-1.5">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        Descargar log
      </a>
      <button @click="viewTail()" :disabled="!info.exists"
              class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle
                     text-fg-muted hover:text-fg px-3 py-2 rounded-md transition disabled:opacity-40 flex items-center gap-1.5">
        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
        Ver últimas líneas
      </button>
      <button @click="load()"
              class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle
                     text-fg-muted hover:text-fg px-3 py-2 rounded-md transition flex items-center gap-1.5">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        Recargar
      </button>
    </div>

    <template x-if="showTail">
      <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-6"
           @click="showTail = false" @keydown.escape.window="showTail = false">
        <div class="bg-bg-elevated border border-border-strong rounded-2xl shadow-modal animate-scale-in w-full max-w-4xl max-h-[85vh] flex flex-col"
             role="dialog" aria-modal="true" aria-labelledby="log-tail-title" x-trap="true"
             @click.stop>
          <div class="flex items-center justify-between p-4 border-b border-border-subtle">
            <h3 id="log-tail-title" class="font-medium flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4 text-fg-muted"></i>
              {{ t.settings_log_tail_title }}
            </h3>
            <div class="flex items-center gap-2">
              <button @click="copyTail()"
                      class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle
                             text-fg-muted hover:text-fg px-3 py-1.5 rounded transition flex items-center gap-1.5">
                <template x-if="!copied">
                  <span class="flex items-center gap-1.5">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    {{ t.settings_copy_btn }}
                  </span>
                </template>
                <template x-if="copied">
                  <span class="flex items-center gap-1.5 text-success">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    {{ t.settings_copied_btn }}
                  </span>
                </template>
              </button>
              <button type="button" aria-label="{{ t.common_close }}" @click="showTail = false" class="text-fg-muted hover:text-fg p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
          <pre class="flex-1 overflow-auto p-4 text-[11px] font-mono text-fg-muted whitespace-pre-wrap break-all"
               x-text="tailText"></pre>
        </div>
      </div>
    </template>
  </div>
</div>
