<div x-show="!searchQuery && activeSection === 'offline' && !loading"
     x-data="bulkData()" x-init="init()"
     x-cloak class="space-y-4">
  <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4">
    <div class="flex items-center gap-2">
      <i data-lucide="cloud-download" class="w-4 h-4 text-accent"></i>
      <h2 class="font-medium">{{ t.settings_offline_title }}</h2>
    </div>
    <p class="text-sm text-fg-muted">{{ t.settings_offline_desc }}</p>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-bg-subtle border border-border-subtle rounded-lg p-3">
        <div class="text-xs text-fg-muted">{{ t.settings_offline_printings }}</div>
        <div class="text-lg font-medium"
             x-text="status.printings.toLocaleString()"></div>
      </div>
      <div class="bg-bg-subtle border border-border-subtle rounded-lg p-3">
        <div class="text-xs text-fg-muted">{{ t.settings_offline_unique }}</div>
        <div class="text-lg font-medium"
             x-text="status.unique_cards.toLocaleString()"></div>
      </div>
    </div>

    <div x-show="active" x-cloak class="space-y-2">
      <div class="flex justify-between text-xs text-fg-muted">
        <span x-text="progress.kind || ''"></span>
        <span><span x-text="percent"></span>% <span x-text="eta"></span></span>
      </div>
      <div class="w-full h-2 bg-bg-subtle rounded-full overflow-hidden">
        <div class="h-full bg-accent transition-all duration-300"
             :style="`width: ${percent}%`"></div>
      </div>
      <button @click="cancel()"
              class="text-xs text-fg-muted hover:text-danger px-2 py-1 rounded
                     border border-border-subtle hover:border-danger/50">
        {{ t.common_cancel }}
      </button>
    </div>

    <div class="flex items-center gap-2" x-show="!active">
      <button @click="start(false)" :disabled="starting"
              class="px-3 py-1.5 text-sm rounded-md bg-accent/20 border border-accent/50
                     text-accent hover:bg-accent/30 disabled:opacity-50">
        <span x-show="!starting">{{ t.settings_offline_sync }}</span>
        <span x-show="starting" x-cloak>{{ t.common_loading }}</span>
      </button>
      <button @click="start(true)" :disabled="starting"
              x-show="status.printings > 0" x-cloak
              class="px-3 py-1.5 text-sm rounded-md border border-border-subtle
                     text-fg-muted hover:text-fg disabled:opacity-50">
        {{ t.settings_offline_resync }}
      </button>
    </div>

    <p class="text-xs text-fg-muted" x-show="!status.ijson_available" x-cloak>
      {{ t.settings_offline_ijson_hint }}
    </p>
  </div>
</div>
