<div x-show="!searchQuery && activeSection === 'autofill' && !loading" x-cloak class="space-y-4">
  <div class="bg-bg-elevated border border-border-subtle rounded-xl p-6 shadow-card space-y-4"
       x-data="autofillStatus()" x-init="load()">
    <div class="flex items-center gap-2">
      <i data-lucide="zap" class="w-4 h-4 text-accent"></i>
      <h2 class="font-medium">{{ t.settings_autofill }}</h2>
      <span class="ml-auto flex items-center gap-1.5 text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full"
              :class="status.available ? 'bg-success' : 'bg-fg-faint'"></span>
        <span :class="status.available ? 'text-success' : 'text-fg-faint'"
              x-text="status.available ? '{{ t.settings_autofill_detected }}' : '{{ t.settings_autofill_not_found }}'"></span>
      </span>
    </div>
    <p class="text-xs text-fg-muted">{{ t.settings_autofill_desc }}</p>

    <template x-if="status.available">
      <div class="text-xs bg-success-bg border border-success-border rounded-lg p-3 space-y-1">
        <div class="text-success font-medium flex items-center gap-1.5">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
          {{ t.settings_autofill_detected_text }}
        </div>
        <div class="text-fg-muted font-mono break-all" x-text="status.exe_path"></div>
        <div class="text-fg-faint">{{ t.settings_autofill_origin }}: <span x-text="status.source"></span></div>
      </div>
    </template>
    <template x-if="!status.available">
      <div class="text-xs bg-bg-subtle border border-border-subtle rounded-lg p-3 space-y-2">
        <div class="text-fg-muted">
          {{ t.settings_autofill_not_found_desc }}
          <span x-text="status.hint" class="block mt-1"></span>
        </div>
        <a href="https://github.com/chilli-axe/mpc-autofill/releases" target="_blank"
           class="inline-flex items-center gap-1 text-accent hover:underline">
          <i data-lucide="external-link" class="w-3 h-3"></i>
          {{ t.settings_autofill_download_link }}
        </a>
        <div class="text-fg-faint pt-2 border-t border-border-subtle">
          {{ t.settings_autofill_place_hint }}
        </div>
      </div>
    </template>

    <button @click="load()"
            class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle text-fg-muted hover:text-fg
                   px-3 py-1.5 rounded transition flex items-center gap-1.5 w-fit">
      <i data-lucide="refresh-cw" class="w-3 h-3"></i>
      {{ t.settings_recheck }}
    </button>

    <div class="pt-4 border-t border-border-subtle space-y-4">
      <template x-for="def in defsInGroup('MPC Autofill')" :key="def.key">
        <div x-html="renderRow(def)"></div>
      </template>
    </div>
  </div>
</div>
