<template x-if="showDrivesModal">
  <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
       @click="showDrivesModal = false"
       @keydown.escape.window="showDrivesModal = false">
    <div class="bg-bg-elevated border border-border-strong rounded-2xl shadow-modal animate-scale-in w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden"
         role="dialog" aria-modal="true" aria-labelledby="drives-title" x-trap="true"
         @click.stop>
      <div x-data="artSourcesPanel()" x-init="load()" class="flex flex-col min-h-0 flex-1">

        <div class="flex items-center justify-between gap-3 p-5 border-b border-border-subtle">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-lg bg-accent/10 text-accent flex items-center justify-center shrink-0">
              <i data-lucide="image" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0">
              <h3 id="drives-title" class="font-medium">{{ t.settings_manage_sources }}</h3>
              <p class="text-[11px] text-fg-faint mt-0.5">
                <span x-text="sources.length"></span> {{ t.settings_drives_count_label }} ·
                <span x-text="stats.total_files.toLocaleString()"></span> {{ t.settings_files_indexed_count }}
              </p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button @click="restore()" :disabled="restoring"
                    class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle
                           text-fg-muted hover:text-fg px-3 py-1.5 rounded transition disabled:opacity-50
                           flex items-center gap-1.5"
                    :title="`{{ t.settings_restore_confirm }}`.replace('{n}', catalogSize)">
              <i data-lucide="refresh-ccw" class="w-3.5 h-3.5" :class="restoring ? 'animate-spin' : ''"></i>
              <span x-show="!restoring">{{ t.settings_restore_catalog }}</span>
              <span x-show="restoring">{{ t.settings_restoring }}</span>
            </button>
            <button @click="showAdd = !showAdd"
                    class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle
                           text-fg-muted hover:text-fg px-3 py-1.5 rounded transition flex items-center gap-1.5">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span x-show="!showAdd">{{ t.settings_add_drive }}</span>
              <span x-show="showAdd">{{ t.common_cancel }}</span>
            </button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-4">

        <div class="bg-info-bg border border-info-border rounded-lg p-3 space-y-2">

          <template x-if="!batchProgress">
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="search" class="w-4 h-4 text-info"></i>
                  <span class="text-xs font-medium text-info">{{ t.settings_fuzzy_index }}</span>
                </div>
                <div class="flex items-center gap-1">
                  <button @click="indexPinned()" :disabled="indexingIds.length > 0"
                          class="text-[10px] bg-bg-subtle hover:bg-info-bg border border-border-subtle
                                 text-fg-muted hover:text-info px-2 py-1 rounded disabled:opacity-50 transition"
                          title="{{ t.settings_index_pinned }}">
                    {{ t.settings_index_pinned_btn }}
                  </button>
                  <button @click="indexAll()" :disabled="indexingIds.length > 0"
                          class="text-[10px] bg-bg-subtle hover:bg-info-bg border border-border-subtle
                                 text-fg-muted hover:text-info px-2 py-1 rounded disabled:opacity-50 transition"
                          title="{{ t.settings_index_all }}">
                    {{ t.settings_index_all_btn }}
                  </button>
                </div>
              </div>
              <div class="text-[11px] text-fg-muted">
                <span x-text="stats.total_files.toLocaleString()"></span> {{ t.settings_files_indexed_count }}
                · <span x-text="stats.sources_indexed"></span> drives
                <template x-if="indexingIds.length > 0">
                  <span class="text-info animate-pulse ml-1">
                    {{ t.settings_indexing_plural }} <span x-text="indexingIds.length"></span>…
                  </span>
                </template>
              </div>
              <template x-if="!hasApiKey">
                <div class="text-[10px] text-warning flex items-start gap-1">
                  <i data-lucide="alert-triangle" class="w-3 h-3 shrink-0 mt-0.5"></i>
                  <span>{{ t.settings_no_api_key }} {{ t.settings_network_link }}.</span>
                </div>
              </template>
              <template x-if="hasApiKey">
                <div class="text-[10px] text-success flex items-center gap-1">
                  <i data-lucide="check" class="w-3 h-3"></i>
                  {{ t.settings_apikey_ok }}
                </div>
              </template>
            </div>
          </template>

          <template x-if="batchProgress">
            <div class="space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="loader-2" class="w-4 h-4 text-info"
                     :class="batchProgress.all_done || batchProgress.cancelled ? '' : 'animate-spin'"></i>
                  <span class="text-xs font-medium text-info" x-text="batchProgressTitle()"></span>
                </div>
                <div class="flex items-center gap-1">
                  <template x-if="!batchProgress.all_done && !batchProgress.cancelled">
                    <button @click="cancelBatch()"
                            class="text-[10px] bg-bg-subtle hover:bg-danger-bg border border-border-subtle
                                   text-fg-muted hover:text-danger px-2 py-1 rounded transition">
                      Cancelar
                    </button>
                  </template>
                  <template x-if="batchProgress.all_done || batchProgress.cancelled">
                    <button @click="closeBatchProgress()"
                            class="text-[10px] bg-bg-subtle hover:bg-info-bg border border-border-subtle
                                   text-fg-muted hover:text-info px-2 py-1 rounded transition">
                      Cerrar
                    </button>
                  </template>
                </div>
              </div>

              <div class="space-y-1">
                <div class="w-full h-2 bg-bg-subtle rounded-full overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-500 ease-out"
                       :class="batchProgress.cancelled ? 'bg-warning' : batchProgress.all_done ? 'bg-success' : 'bg-info'"
                       :style="`width: ${batchProgress.percent || 0}%`"></div>
                </div>
                <div class="flex items-center justify-between text-[10px] text-fg-faint">
                  <span>
                    <span x-text="batchProgress.done_count"></span> / <span x-text="batchProgress.total"></span> drives
                  </span>
                  <span x-show="batchProgress.eta_seconds && !batchProgress.all_done && !batchProgress.cancelled"
                        x-text="'~' + formatEta(batchProgress.eta_seconds) + ' restante'"></span>
                  <span x-show="batchProgress.all_done"
                        x-text="formatEta(batchProgress.batch_elapsed_seconds) + ' total'"></span>
                  <span x-show="batchProgress.cancelled" class="text-warning">Cancelado</span>
                </div>
              </div>

              <template x-if="batchProgress.active">
                <div class="bg-bg-subtle/60 border border-info/20 rounded-md px-3 py-2 space-y-1">
                  <div class="flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="w-3 h-3 text-info animate-spin"></i>
                    <span class="text-[11px] font-medium text-fg truncate" x-text="batchProgress.active.source_name"></span>
                  </div>
                  <div class="text-[10px] text-fg-faint font-mono">
                    +<span x-text="batchProgress.active.files_added"></span> archivos
                    · <span x-text="batchProgress.active.folders_visited"></span> carpetas
                    · <span x-text="batchProgress.active.elapsed_seconds.toFixed(0)"></span>s
                  </div>
                </div>
              </template>

              <div class="max-h-40 overflow-y-auto space-y-0.5">
                <template x-for="item in batchProgress.queued.slice(0, 5)" :key="item.source_id">
                  <div class="flex items-center gap-2 text-[10px] text-fg-faint px-1 py-0.5">
                    <span class="w-3 h-3 flex items-center justify-center text-fg-faint">○</span>
                    <span class="truncate" x-text="item.source_name"></span>
                  </div>
                </template>
                <template x-if="batchProgress.queued.length > 5">
                  <div class="text-[10px] text-fg-faint px-1 py-0.5 italic">
                    … y <span x-text="batchProgress.queued.length - 5"></span> más en cola
                  </div>
                </template>
                <template x-for="item in batchProgress.completed.slice(-5).reverse()" :key="item.source_id">
                  <div class="flex items-center gap-2 text-[10px] px-1 py-0.5"
                       :class="item.status === 'done' ? 'text-success' : item.status === 'error' ? 'text-danger' : 'text-fg-faint'">
                    <span class="w-3 h-3 flex items-center justify-center shrink-0">
                      <template x-if="item.status === 'done'">
                        <i data-lucide="check" class="w-3 h-3"></i>
                      </template>
                      <template x-if="item.status === 'error'">
                        <i data-lucide="alert-triangle" class="w-3 h-3"></i>
                      </template>
                      <template x-if="item.status === 'cancelled'">
                        <i data-lucide="x" class="w-3 h-3"></i>
                      </template>
                    </span>
                    <span class="truncate" x-text="item.source_name"></span>
                    <span class="ml-auto shrink-0 font-mono" x-show="item.files_total > 0"
                          x-text="item.files_total.toLocaleString()"></span>
                    <span class="ml-auto shrink-0 font-mono text-danger" x-show="item.error"
                          x-text="(item.error || '').substring(0, 40)"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>

        </div>

        <div x-show="showAdd" x-transition
             class="bg-bg-subtle/30 border border-border-subtle rounded-lg p-4 space-y-2">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input type="text" x-model="draft.name" placeholder="Name (e.g. Cardstock Con)"
                   class="bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                          focus:outline-none focus:border-accent">
            <input type="text" x-model="draft.tags" placeholder="Tags separated by comma"
                   class="bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                          focus:outline-none focus:border-accent">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-2">
            <select x-model="draft.source_type"
                    @change="draft.url && validateSource()"
                    class="bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                           focus:outline-none focus:border-accent">
              <option value="">{{ t.settings_type_auto }}</option>
              <option value="gdrive">Google Drive (folder)</option>
              <option value="gdrive-file">Google Drive (file)</option>
              <option value="local-folder">Local folder</option>
              <option value="http-listing">HTTP manifest (JSON)</option>
              <option value="s3">S3 / Cloudflare R2 (public)</option>
            </select>
            <button type="button" @click="validateSource()"
                    :disabled="!draft.url || validating"
                    class="bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-xs
                           hover:border-accent-soft transition disabled:opacity-50">
              <span x-show="!validating">{{ t.settings_validate_url }}</span>
              <span x-show="validating">{{ t.settings_validating }}</span>
            </button>
          </div>
          <input type="url" x-model="draft.url"
                 @blur="draft.url && validateSource()"
                 :placeholder="urlPlaceholder()"
                 class="w-full bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                        focus:outline-none focus:border-accent">
          <div x-show="validation.checked"
               :class="validation.valid ? 'text-green-500' : 'text-red-400'"
               class="text-xs px-3 py-1">
            <span x-show="validation.valid">
              ✓ <span x-text="validation.label"></span> {{ t.settings_validated }}
              <span x-show="validation.canonical_url && validation.canonical_url !== draft.url"
                    class="text-fg-faint ml-1">
                · URL: <span x-text="validation.canonical_url"></span>
              </span>
            </span>
            <span x-show="!validation.valid">
              ✗ <span x-text="validation.error || '{{ t.settings_url_invalid }}'"></span>
            </span>
          </div>
          <textarea x-model="draft.description" rows="2"
                    placeholder="Description (optional)"
                    class="w-full bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                           focus:outline-none focus:border-accent"></textarea>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-xs text-fg-muted">
              <input type="checkbox" x-model="draft.pinned"
                     class="rounded border-border-strong bg-bg-subtle text-accent">
              {{ t.settings_pin_label }}
            </label>
            <button @click="add()" :disabled="!draft.name || !draft.url || saving"
                    class="bg-accent hover:bg-accent-soft text-black text-sm font-medium px-4 py-1.5 rounded-md
                           disabled:opacity-50 transition">
              <span x-show="!saving">{{ t.settings_add_btn }}</span>
              <span x-show="saving">{{ t.settings_saving }}</span>
            </button>
          </div>
        </div>

        <template x-if="sources.length === 0 && !loading">
          <div class="text-sm text-fg-faint text-center py-8">
            {{ t.settings_no_drives }}
          </div>
        </template>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <template x-for="s in sources" :key="s.id">
            <div class="bg-bg-subtle/50 border rounded-lg p-3 text-xs space-y-2 transition"
                 :class="s.pinned ? 'border-accent/40' : 'border-border-subtle'">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5">
                    <template x-if="s.pinned">
                      <i data-lucide="star" class="w-3 h-3 text-accent shrink-0 fill-current"></i>
                    </template>
                    <div class="font-medium text-fg truncate" x-text="s.name"></div>
                  </div>
                  <template x-if="s.description">
                    <div class="text-fg-faint mt-1 line-clamp-2" x-text="s.description"></div>
                  </template>
                  <template x-if="s.tags && s.tags.length">
                    <div class="flex flex-wrap gap-1 mt-1.5">
                      <template x-for="t in s.tags" :key="t">
                        <span class="text-[10px] bg-bg-subtle border border-border-subtle rounded px-1 py-0.5 text-fg-faint" x-text="t"></span>
                      </template>
                    </div>
                  </template>
                  <template x-if="indexingIds.includes(s.id)">
                    <div class="text-[10px] text-info mt-1.5 font-mono animate-pulse">
                      {{ t.settings_drive_indexing }}
                      <template x-if="s.indexed_files > 0">
                        <span>(<span x-text="s.indexed_files.toLocaleString()"></span> {{ t.settings_until_now }})</span>
                      </template>
                    </div>
                  </template>
                  <template x-if="!indexingIds.includes(s.id) && s.indexed_files > 0">
                    <div class="text-[10px] text-info mt-1.5 font-mono flex items-center gap-1">
                      <i data-lucide="check" class="w-3 h-3"></i>
                      {{ t.settings_indexed_files }} <span x-text="s.indexed_files.toLocaleString()"></span> {{ t.settings_files_col | lower }}
                    </div>
                  </template>
                  <template x-if="s.index_error">
                    <div class="text-[10px] text-danger mt-1.5 flex items-start gap-1">
                      <i data-lucide="alert-triangle" class="w-3 h-3 shrink-0 mt-0.5"></i>
                      <span x-text="s.index_error"></span>
                    </div>
                  </template>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <a :href="s.url" target="_blank" rel="noopener"
                     class="p-1.5 rounded bg-bg-subtle hover:bg-border-subtle text-fg-muted hover:text-accent transition"
                     title="{{ t.settings_open_browser }}">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  </a>
                  <button @click="indexOne(s)"
                          :disabled="indexingIds.includes(s.id)"
                          class="p-1.5 rounded bg-bg-subtle hover:bg-info-bg text-fg-muted hover:text-info transition disabled:opacity-50"
                          :title="s.indexed_files > 0 ? '{{ t.settings_reindex }}' : '{{ t.settings_fuzzy_index }}'">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="indexingIds.includes(s.id) ? 'animate-spin' : ''"></i>
                  </button>
                  <button @click="togglePin(s)"
                          class="p-1.5 rounded bg-bg-subtle hover:bg-border-subtle text-fg-muted hover:text-accent transition"
                          :title="s.pinned ? '{{ t.settings_unpin_drive }}' : '{{ t.settings_pin_drive }}'">
                    <i data-lucide="star" class="w-3.5 h-3.5"></i>
                  </button>
                  <button @click="remove(s)"
                          class="p-1.5 rounded bg-bg-subtle hover:bg-danger-bg text-fg-muted hover:text-danger transition"
                          title="{{ t.common_delete }}">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
              <div class="text-[10px] font-mono text-fg-faint truncate" x-text="s.url"></div>
            </div>
          </template>
        </div>

        <div class="text-[11px] text-fg-faint mt-2 space-y-1 pt-3 border-t border-border-subtle">
          <div class="font-medium text-fg-muted mb-1">{{ t.settings_how_to_use_drives }}</div>
          <div class="pl-3 space-y-0.5">
            <div><span class="text-fg-muted">1.</span> {{ t.settings_drive_step1 }}</div>
            <div><span class="text-fg-muted">2a.</span> {{ t.settings_drive_step2a }}</div>
            <div><span class="text-fg-muted">2b.</span> {{ t.settings_drive_step2b }}</div>
          </div>
        </div>
        </div>
      </div>

      <button @click="showDrivesModal = false"
              class="absolute top-5 right-5 text-fg-muted hover:text-fg p-1 rounded"
              title="{{ t.settings_close_esc }}">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
  </div>
</template>
