<template x-if="similarOpen">
  <div class="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4"
       @click="closeSimilar()"
       @keydown.escape.window="closeSimilar()">
    <div class="bg-bg-elevated border border-border-strong rounded-2xl shadow-modal animate-scale-in w-full max-w-4xl
                max-h-[85vh] flex flex-col overflow-hidden"
         @click.stop>
      <div class="flex items-center justify-between p-5 border-b border-border-subtle shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center shrink-0">
            <i data-lucide="link-2" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <h2 class="text-lg font-semibold text-fg">Artes similares</h2>
            <p class="text-xs text-fg-faint truncate">
              Match perceptual (pHash) del arte <span x-text="similarSourceArt?.__label || ''"></span>
            </p>
          </div>
        </div>
        <button @click="closeSimilar()" class="text-fg-faint hover:text-fg-muted p-2 rounded hover:bg-bg-subtle transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-5">
        <template x-if="similarLoading">
          <div class="text-center py-12 text-fg-faint text-sm">
            <div class="spinner-ring mb-3"></div>
            <p>Buscando…</p>
          </div>
        </template>
        <template x-if="!similarLoading && similarData">
          <div>
            <template x-if="similarData.similar.length === 0">
              <p class="text-center py-8 text-sm text-fg-faint">
                No hay otros drives con imágenes perceptualmente idénticas.
              </p>
            </template>
            <template x-if="similarData.similar.length > 0">
              <div>
                <p class="text-xs text-fg-faint mb-3">
                  <span x-text="similarData.similar.length"></span> resultado(s) —
                  ordenados por proximidad de hash.
                </p>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                  <template x-for="sim in similarData.similar" :key="sim.file_id">
                    <div class="bg-bg-subtle/30 border border-border-subtle rounded-lg overflow-hidden">
                      <div class="aspect-[63/88] bg-bg-subtle">
                        <img :src="sim.thumb_url" :alt="sim.filename"
                             loading="lazy" class="w-full h-full object-cover"
                             @error="$el.style.opacity = 0.3">
                      </div>
                      <div class="p-2">
                        <div class="text-xs text-fg truncate" x-text="sim.filename"></div>
                        <div class="text-[10px] text-fg-faint">
                          Source #<span x-text="sim.source_id"></span> ·
                          hamming <span x-text="sim.hamming"></span>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
