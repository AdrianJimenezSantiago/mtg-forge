<template x-if="shortcutsOpen">
  <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
       @click.self="shortcutsOpen = false" @keydown.escape.window="shortcutsOpen = false">
    <div class="bg-bg-elevated border border-border-strong rounded-xl shadow-modal w-full max-w-md p-5"
         role="dialog" aria-modal="true" aria-labelledby="shortcuts-title" x-trap="true">
      <div class="flex items-center justify-between mb-3">
        <h2 id="shortcuts-title" class="font-semibold flex items-center gap-2">
          <i data-lucide="keyboard" class="w-4 h-4 text-accent"></i>{{ t.shortcut_title }}
        </h2>
        <button type="button" aria-label="{{ t.common_close }}" @click="shortcutsOpen = false" class="text-fg-faint hover:text-fg p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <dl class="space-y-1.5 text-sm">
        <template x-for="s in shortcutList" :key="s.action">
          <div class="flex items-center justify-between gap-3">
            <dt class="text-fg-muted" x-text="window._T[s.label]"></dt>
            <dd class="flex gap-1">
              <template x-for="k in s.keys" :key="k">
                <kbd class="bg-bg-subtle border border-border-subtle rounded px-1.5 text-xs font-mono" x-text="k"></kbd>
              </template>
            </dd>
          </div>
        </template>
      </dl>
    </div>
  </div>
</template>
