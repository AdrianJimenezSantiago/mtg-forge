<template x-if="statsOpen">
  <div class="st-overlay fixed inset-0 z-50 flex items-center justify-center p-6"
       @click="closeStats()"
       @keydown.escape.window="closeStats()">
    <div class="st-panel w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden"
         role="dialog" aria-modal="true" aria-labelledby="st-title" x-trap="true"
         @click.stop>

      <div class="st-head">
        <div class="st-head__id">
          <template x-if="coverUrl">
            <img :src="coverUrl" alt="" class="st-head__cover">
          </template>
          <template x-if="!coverUrl">
            <span class="st-head__icon"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></span>
          </template>
          <div class="min-w-0">
            <p class="st-head__kicker">{{ t.stats_subtitle }}</p>
            <h2 id="st-title" class="st-head__title" x-text="deck ? deck.name : ''"></h2>
          </div>
        </div>
        <button @click="closeStats()" class="st-close" title="{{ t.common_close }}" aria-label="{{ t.common_close }}">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="st-body" tabindex="0" :class="{ 'is-ready': statsReady }">

        <template x-if="stats.totalCards === 0">
          <p class="st-empty">{{ t.stats_empty }}</p>
        </template>

        <template x-if="stats.totalCards > 0">
        <div class="st-content">

          <div class="st-tiles">
            <div class="st-tile" style="--i: 0">
              <span class="st-tile__icon"><i data-lucide="library"></i></span>
              <p class="st-tile__label">{{ t.stats_total }}</p>
              <p class="st-tile__value" x-tween.from0="stats.totalCards"></p>
              <p class="st-tile__hint" x-text="tf('stats_unique', {n: stats.uniqueCards})"></p>
            </div>
            <div class="st-tile" style="--i: 1">
              <span class="st-tile__icon"><i data-lucide="gauge"></i></span>
              <p class="st-tile__label">{{ t.stats_avg_cmc }}</p>
              <p class="st-tile__value" x-tween.2.from0="stats.avgCmc === null ? '—' : stats.avgCmc"></p>
              <p class="st-tile__hint">{{ t.stats_avg_cmc_hint }}</p>
            </div>
            <div class="st-tile st-tile--ring" style="--i: 2">
              <svg class="st-ring" viewBox="0 0 42 42" aria-hidden="true">
                <circle class="st-ring__track" cx="21" cy="21" r="15.9155"/>
                <circle class="st-ring__value st-ring__value--land" cx="21" cy="21" r="15.9155"
                        :style="`--len: ${stats.landPct}`"/>
              </svg>
              <p class="st-tile__label">{{ t.stats_lands }}</p>
              <p class="st-tile__value">
                <span x-tween.from0="stats.landCount"></span><span class="st-tile__pct" x-text="stats.landPct + '%'"></span>
              </p>
              <p class="st-tile__hint" x-text="tf('stats_lands_hint', {basic: stats.basicLandCount, nonbasic: stats.nonBasicLandCount})"></p>
            </div>
            <div class="st-tile st-tile--ring" style="--i: 3">
              <svg class="st-ring" viewBox="0 0 42 42" aria-hidden="true">
                <circle class="st-ring__track" cx="21" cy="21" r="15.9155"/>
                <circle class="st-ring__value" cx="21" cy="21" r="15.9155"
                        :style="`--len: ${100 - stats.landPct}`"/>
              </svg>
              <p class="st-tile__label">{{ t.stats_nonlands }}</p>
              <p class="st-tile__value" x-tween.from0="stats.nonLandCount"></p>
              <p class="st-tile__hint" x-text="tf('stats_nonlands_hint', {pct: 100 - stats.landPct})"></p>
            </div>
          </div>

          <section class="st-card st-card--wide" style="--i: 4">
            <header class="st-card__head">
              <h3><i data-lucide="trending-up"></i>{{ t.stats_curve_title }}</h3>
              <span class="st-note">{{ t.stats_curve_note }}</span>
            </header>
            <div class="st-curve" @mouseleave="statsHover = {chart: null, key: null}">
              <div class="st-curve__plot">
                <template x-for="g in stats.curve.gridlines" :key="g.v">
                  <div class="st-grid" :style="`bottom: ${g.pct}%`"><span x-text="g.v"></span></div>
                </template>
                <template x-if="stats.curve.avgPos !== null">
                  <div class="st-avg" :style="`left: ${stats.curve.avgPos}%`">
                    <span x-text="tf('stats_curve_avg', {v: stats.avgCmc.toFixed(2)})"></span>
                  </div>
                </template>
                <div class="st-cols">
                  <template x-for="col in stats.curve.columns" :key="col.bucket">
                    <div class="st-col" :style="`--i: ${col.i}`"
                         :class="{ 'is-dim': statsDim('curve', col.bucket), 'is-empty': col.total === 0 }"
                         @mouseenter="statsHover = {chart: 'curve', key: col.bucket}">
                      <span class="st-col__count" x-show="col.total > 0"
                            :style="`bottom: calc(${col.pct}% + 4px)`" x-text="col.total"></span>
                      <div class="st-col__bar" :style="`height: ${col.pct}%`">
                        <template x-for="sg in col.segments" :key="sg.key">
                          <span class="st-seg" :class="'st-bg-' + sg.key" :style="`flex-grow: ${sg.count}`"></span>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
              <div class="st-curve__axis">
                <template x-for="col in stats.curve.columns" :key="col.bucket">
                  <span :class="{ 'is-active': statsHover.chart === 'curve' && statsHover.key === col.bucket }"
                        x-text="col.bucket"></span>
                </template>
              </div>
              <p class="st-caption" x-text="curveCaption()"></p>
            </div>
          </section>

          <section class="st-card" style="--i: 5">
            <header class="st-card__head">
              <h3><i data-lucide="palette"></i>{{ t.stats_colors_title }}</h3>
              <span class="st-note">{{ t.stats_colors_note }}</span>
            </header>
            <div class="st-donut-wrap" @mouseleave="statsHover = {chart: null, key: null}">
              <div class="st-donut">
                <svg viewBox="0 0 42 42" aria-hidden="true">
                  <circle class="st-donut__track" cx="21" cy="21" r="15.9155"/>
                  {% for key in ['W', 'U', 'B', 'R', 'G', 'C'] %}
                  <circle class="st-donut__seg st-stroke-{{ key }}" cx="21" cy="21" r="15.9155"
                          x-show="colorSeg('{{ key }}')"
                          :class="{ 'is-dim': statsDim('colors', '{{ key }}') }"
                          :style="colorSeg('{{ key }}') ? `--len: ${colorSeg('{{ key }}').len}; --start: ${colorSeg('{{ key }}').start}; --i: ${colorSeg('{{ key }}').i}` : ''"
                          @mouseenter="statsHover = {chart: 'colors', key: '{{ key }}'}"/>
                  {% endfor %}
                </svg>
                <div class="st-donut__center">
                  <strong x-tween.from0="donutCenter().value"></strong>
                  <span x-text="donutCenter().label"></span>
                </div>
              </div>
              <ul class="st-legend">
                <template x-for="sg in stats.colors.segments" :key="sg.key">
                  <li :class="{ 'is-dim': statsDim('colors', sg.key) }" :style="`--i: ${sg.i}`"
                      @mouseenter="statsHover = {chart: 'colors', key: sg.key}">
                    <i class="ms ms-cost ms-shadow" :class="'ms-' + sg.key.toLowerCase()"></i>
                    <span class="st-legend__name" x-text="window._t('stats_color_' + sg.key)"></span>
                    <span class="st-legend__count" x-text="sg.count"></span>
                    <span class="st-legend__pct" x-text="Math.round(sg.pct) + '%'"></span>
                  </li>
                </template>
              </ul>
            </div>
          </section>

          <section class="st-card" style="--i: 6">
            <header class="st-card__head">
              <h3><i data-lucide="gem"></i>{{ t.stats_rarity_title }}</h3>
              <span class="st-note">{{ t.stats_rarity_note }}</span>
            </header>
            <div class="st-ribbon" @mouseleave="statsHover = {chart: null, key: null}">
              <template x-for="sg in stats.rarity.segments" :key="sg.key">
                <span class="st-ribbon__seg" :class="['st-rarity-' + sg.key, statsDim('rarity', sg.key) ? 'is-dim' : '']"
                      :style="`flex-grow: ${sg.count}; --i: ${sg.i}`"
                      :title="window._t('stats_rarity_' + sg.key) + ': ' + sg.count"
                      @mouseenter="statsHover = {chart: 'rarity', key: sg.key}"></span>
              </template>
            </div>
            <ul class="st-rarities" @mouseleave="statsHover = {chart: null, key: null}">
              <template x-for="sg in stats.rarity.segments" :key="sg.key">
                <li :class="{ 'is-dim': statsDim('rarity', sg.key) }" :style="`--i: ${sg.i}`"
                    @mouseenter="statsHover = {chart: 'rarity', key: sg.key}">
                  <span class="st-gem" :class="'st-rarity-' + sg.key"></span>
                  <span class="st-rarities__name" x-text="window._t('stats_rarity_' + sg.key)"></span>
                  <span class="st-rarities__count" x-text="sg.count"></span>
                  <span class="st-rarities__pct" x-text="Math.round(sg.pct) + '%'"></span>
                </li>
              </template>
            </ul>
          </section>

          <section class="st-card" style="--i: 7">
            <header class="st-card__head">
              <h3><i data-lucide="layers-3"></i>{{ t.stats_types_title }}</h3>
              <span class="st-note" x-text="tf('stats_types_note', {n: stats.totalCards})"></span>
            </header>
            <ul class="st-types">
              <template x-for="row in stats.types" :key="row.key">
                <li class="st-type" :style="`--i: ${row.i}`">
                  <i class="ms st-type__icon" :class="'ms-' + typeIcon(row.key)"></i>
                  <span class="st-type__name" x-text="window._t('stats_type_' + row.key)"></span>
                  <span class="st-type__track"><span class="st-type__fill" :style="`width: ${row.pct}%`"></span></span>
                  <span class="st-type__count" x-text="row.count"></span>
                  <span class="st-type__share" x-text="row.share + '%'"></span>
                </li>
              </template>
            </ul>
          </section>

          <section class="st-card" style="--i: 8" x-show="stats.keywords.length > 0">
            <header class="st-card__head">
              <h3><i data-lucide="sparkles"></i>{{ t.stats_keywords_title }}</h3>
              <span class="st-note">{{ t.stats_keywords_note }}</span>
            </header>
            <div class="st-keywords">
              <template x-for="kw in stats.keywords" :key="kw.name">
                <span class="st-kw" :style="`--i: ${kw.i}; --w: ${kw.weight}`">
                  <span x-text="kw.name"></span>
                  <b x-text="kw.count"></b>
                </span>
              </template>
            </div>
          </section>

        </div>
        </template>
      </div>

      <div class="st-foot">{{ t.stats_footer }}</div>
    </div>
  </div>
</template>
