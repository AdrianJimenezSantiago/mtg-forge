<div class="space-y-6">

  <div class="space-y-4">

    <div class="flex items-center gap-2 text-sm flex-wrap">
      <input type="search" x-model="filter" placeholder="{{ t.deck_filter_placeholder }}"
             class="bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm w-72
                    focus:outline-none focus:border-accent">
      <select x-model="sortMode"
              class="bg-bg-subtle border border-border-subtle rounded-md px-2 py-1.5 text-sm text-fg-muted
                     focus:outline-none focus:border-accent">
        <option value="name">{{ t.deck_sort_name }}</option>
        <option value="cmc">{{ t.deck_sort_cmc }}</option>
        <option value="type">{{ t.deck_sort_type }}</option>
        <option value="color">{{ t.deck_sort_color }}</option>
      </select>
      <select x-model="groupMode"
              class="bg-bg-subtle border border-border-subtle rounded-md px-2 py-1.5 text-sm text-fg-muted
                     focus:outline-none focus:border-accent"
              title="{{ t.deck_title_group_cards }}">
        <option value="role">{{ t.deck_group_role }}</option>
        <option value="type">{{ t.deck_group_type }}</option>
      </select>
      <div class="inline-flex bg-bg-subtle border border-border-subtle rounded-md overflow-hidden"
           title="{{ t.deck_title_view_dist }}">
        <button type="button" @click="layoutMode = 'columns'"
                :class="layoutMode === 'columns' ? 'bg-accent/20 text-accent' : 'text-fg-muted hover:text-fg'"
                class="px-2 py-1.5 transition flex items-center gap-1">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          <span class="text-xs">{{ t.deck_view_columns }}</span>
        </button>
        <button type="button" @click="layoutMode = 'list'"
                :class="layoutMode === 'list' ? 'bg-accent/20 text-accent' : 'text-fg-muted hover:text-fg'"
                class="px-2 py-1.5 transition flex items-center gap-1 border-l border-border-subtle">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span class="text-xs">{{ t.deck_view_list }}</span>
        </button>
      </div>
      <button @click="showAddCard = !showAddCard"
              class="text-xs bg-bg-subtle hover:bg-border-subtle border border-border-subtle text-fg-muted hover:text-fg
                     px-3 py-1.5 rounded-md transition">
        <span x-show="!showAddCard">{{ t.deck_add_card }}</span>
        <span x-show="showAddCard">{{ t.common_cancel }}</span>
      </button>
      <span class="ml-auto text-xs text-fg-faint">
        <span x-text="totalCards"></span> {{ t.history_cards_count }} · <span x-text="uniqueCards"></span>
      </span>
    </div>

    <div x-show="showAddCard" x-transition
         class="bg-bg-elevated border border-accent/40 rounded-xl p-4 space-y-2 relative"
         @keydown.escape="autoOpen = false">
      <div class="flex items-center gap-2">
        <div class="flex-1 relative">
          <input type="text" x-model="newCardName" x-ref="newCardInput"
                 placeholder="{{ t.deck_placeholder_card_search }}"
                 @input.debounce.200ms="autocomplete()"
                 @keydown.arrow-down.prevent="autoMove(1)"
                 @keydown.arrow-up.prevent="autoMove(-1)"
                 @keydown.enter.prevent="autoAccept()"
                 @keydown.escape="autoOpen = false"
                 @focus="if (autoResults.length) autoOpen = true"
                 @blur="setTimeout(() => autoOpen = false, 150)"
                 autocomplete="off"
                 class="w-full bg-bg-subtle border border-border-subtle rounded-md px-3 py-1.5 text-sm
                        focus:outline-none focus:border-accent">
          <div x-show="autoOpen && autoResults.length" x-transition
               class="absolute left-0 right-0 top-full mt-1 z-30 bg-bg-elevated border border-border-strong
                      rounded-lg shadow-lg max-h-64 overflow-y-auto">
            <template x-for="(r, i) in autoResults" :key="r">
              <button type="button"
                      @mousedown.prevent="pickAutocomplete(r)"
                      @mouseenter="autoIndex = i"
                      :class="autoIndex === i ? 'bg-bg-subtle text-fg' : 'text-fg-muted'"
                      class="block w-full text-left px-3 py-1.5 text-sm hover:bg-bg-subtle transition"
                      x-text="r"></button>
            </template>
          </div>
        </div>
        <input type="number" x-model.number="newCardQty" min="1" max="99"
               class="w-16 bg-bg-subtle border border-border-subtle rounded-md px-2 py-1.5 text-sm text-center
                      focus:outline-none focus:border-accent">
        <select x-model="newCardRole"
                class="bg-bg-subtle border border-border-subtle rounded-md px-2 py-1.5 text-sm
                       focus:outline-none focus:border-accent">
          <option value="mainboard">{{ t.deck_mainboard_option }}</option>
          <option value="commander">{{ t.deck_commander_option }}</option>
          <option value="companion">{{ t.deck_companion_option }}</option>
          <option value="sideboard">{{ t.deck_role_sideboard }}</option>
          <option value="tokens">{{ t.deck_tokens }}</option>
          <option value="maybeboard">{{ t.deck_role_maybeboard }}</option>
        </select>
        <button @click="addCard()" :disabled="addingCard || !newCardName"
                class="bg-accent hover:bg-accent-soft text-black text-sm font-medium px-4 py-1.5 rounded-md
                       disabled:opacity-50 transition">
          <span x-show="!addingCard">{{ t.deck_add_card_placeholder }}</span>
          <span x-show="addingCard">…</span>
        </button>
      </div>
      <div class="text-[11px] text-fg-faint">
        Se busca por nombre exacto en Scryfall. Aplica preferencia de arte global si existe.
      </div>
    </div>

    <div :class="layoutMode === 'columns'
                   ? 'md:columns-2 lg:columns-3 2xl:columns-4 gap-4'
                   : 'space-y-4'">
      <template x-for="group in displayGroups" :key="group.role">
        <div class="bg-bg-elevated border border-border-subtle rounded-xl overflow-hidden break-inside-avoid mb-4 animate-fade-in">
          <button type="button" @click="toggleGroup(group.role)"
                  class="w-full flex items-center gap-2 px-4 py-2 bg-bg-subtle/50 hover:bg-bg-subtle transition
                         border-b border-border-subtle text-xs uppercase tracking-wider">
            <i data-lucide="chevron-right" class="w-3 h-3 text-fg-muted transition-transform"
               :class="isGroupExpanded(group.role) ? 'rotate-90' : ''"></i>
            <div class="w-1.5 h-1.5 rounded-full" :class="group.dotClass"></div>
            <span class="font-medium text-fg-muted" x-text="group.label"></span>
            <span class="font-mono text-fg-faint" x-text="'(' + group.total + ')'"></span>
            <template x-if="group.role === 'sideboard' || group.role === 'tokens' || group.role === 'maybeboard'">
              <span class="ml-1 text-[10px] text-fg-faint normal-case tracking-normal">· {{ t.deck_no_count | replace("· ", "") }}</span>
            </template>
            <template x-if="group.total > 0 && isGroupExpanded(group.role) && !group.role.startsWith('type:')">
              <span @click.stop="clearRole(group.role, group.total)"
                    class="ml-auto text-[10px] text-fg-faint hover:text-danger normal-case tracking-normal
                           px-2 py-0.5 rounded hover:bg-danger-bg transition cursor-pointer flex items-center gap-1"
                    :title="window._T.deck_clear_section_title + ' ' + group.label">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
                {{ t.deck_group_clear }}
              </span>
            </template>
          </button>

          <div x-show="isGroupExpanded(group.role)" x-collapse>
          <div x-auto-animate.lazy>
          <template x-for="card in group.cards" :key="card.id">
            <div data-flash-row
                 class="flex gap-3 px-3 py-2.5 border-b border-border-subtle last:border-b-0
                        hover:bg-bg-subtle/60 transition relative"
                 :class="[
                   selectedCardId === card.id ? 'bg-bg-subtle/80 ring-1 ring-inset ring-accent/40' : '',
                   !card.include ? 'opacity-50' : '',
                   rarityBorderClass(card.rarity)
                 ]">

              <button @click="openArtPicker(card)"
                      class="shrink-0 w-11 h-[60px] rounded-md overflow-hidden border border-border-subtle
                             hover:border-accent/60 transition relative bg-bg-base"
                      title="{{ t.deck_card_change_art }}">
                <img x-show="card.thumbnail_url"
                     :src="card.thumbnail_url" :data-preview="card.thumbnail_url"
                     x-flip="card.thumbnail_url"
                     class="w-full h-full object-cover object-top" loading="lazy">
                <div x-show="card.quantity > 1"
                     class="absolute bottom-0 inset-x-0 bg-black/75 text-center text-[10px]
                            font-bold text-white leading-[14px]"
                     x-text="card.quantity + '×'"></div>
                <div x-show="card.custom_art_front_id"
                     class="absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-fuchsia-400
                            ring-1 ring-black/40" title="{{ t.deck_art_custom_title }}"></div>
              </button>

              <div class="flex-1 min-w-0 cursor-pointer self-center space-y-0.5"
                   @click="openArtPicker(card)">

                <div class="flex items-start gap-2 min-w-0">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-baseline gap-1 flex-wrap leading-snug">
                      <span x-show="card.quantity === 1"
                            class="text-[10px] font-mono text-fg-faint shrink-0">1×</span>
                      <span class="text-[13px] font-semibold text-fg leading-snug"
                            style="word-break:break-word" x-text="card.name"></span>
                    </div>
                  </div>
                  <span x-show="card.mana_cost" x-html="renderManaCost(card.mana_cost)"
                        class="shrink-0 self-center leading-none pt-0.5"></span>
                </div>

                <div class="flex items-center gap-1.5 flex-wrap">
                  <span x-show="card.type_line"
                        class="text-[11px] text-fg-faint truncate max-w-[16rem]"
                        x-text="shortType(card.type_line)"></span>
                  <span x-show="card.layout === 'transform'"
                        class="shrink-0 text-[9px] font-mono bg-indigo-500/20 text-indigo-300
                               border border-indigo-500/30 rounded px-1" title="{{ t.deck_badge_dfc }}">DFC</span>
                  <span x-show="card.layout === 'modal_dfc'"
                        class="shrink-0 text-[9px] font-mono bg-cyan-500/20 text-cyan-300
                               border border-cyan-500/30 rounded px-1" title="{{ t.deck_badge_mdfc }}">MDFC</span>
                  <span x-show="card.layout === 'meld'"
                        class="shrink-0 text-[9px] font-mono bg-amber-500/20 text-amber-300
                               border border-amber-500/30 rounded px-1" title="{{ t.deck_badge_meld }}">MELD</span>
                  <span x-show="card.layout === 'battle'"
                        class="shrink-0 text-[9px] font-mono bg-red-500/20 text-red-300
                               border border-red-500/30 rounded px-1">BATTLE</span>
                  <span x-show="card.custom_art_front_id"
                        class="shrink-0 text-[9px] font-mono bg-fuchsia-500/20 text-fuchsia-300
                               border border-fuchsia-500/30 rounded px-1">CUSTOM</span>
                </div>

                <div class="flex items-center gap-1.5 flex-wrap">
                  <span x-show="card.rarity"
                        class="text-[9px] font-bold px-1.5 py-0.5 rounded-sm leading-none"
                        :class="rarityChipClass(card.rarity)"
                        :title="card.rarity"
                        x-text="rarityLetter(card.rarity)"></span>
                  <span class="text-[10px] text-fg-faint">
                    <span x-text="card.printings_available"></span> {{ t.deck_card_printings }}
                  </span>
                  <span x-show="card.custom_arts_available > 0"
                        class="text-[10px] text-fuchsia-400">
                    +<span x-text="card.custom_arts_available"></span> custom
                  </span>
                  <span x-show="card.history_copies > 0"
                        class="text-[10px] text-accent/70">
                    {{ t.deck_card_printed }} <span x-text="card.history_copies"></span>×
                  </span>
                  <button x-show="card.back_thumbnail_url"
                          @click.stop="showBackFor(card)"
                          class="text-[10px] text-indigo-300 hover:text-indigo-200
                                 border border-indigo-500/40 hover:border-indigo-500/70
                                 rounded px-1.5 py-0.5 transition"
                          title="Ver reverso">{{ t.deck_card_back }}</button>
                  <button x-show="card.related_parts && card.related_parts.length > 0"
                          @click.stop="addRelated(card)"
                          :disabled="addingRelated === card.id"
                          class="text-[10px] text-amber-300 hover:text-amber-200
                                 border border-amber-500/40 hover:border-amber-500/70
                                 rounded px-1.5 py-0.5 transition disabled:opacity-50"
                          :title="window._T.deck_add_related_title + ': ' + (card.related_parts || []).map(p => p.name).join(', ')">
                    <span x-show="addingRelated !== card.id">
                      + <span x-text="(card.related_parts || []).length"></span>
                      <span x-show="(card.related_parts || []).some(p => p.component === 'meld_result' || p.component === 'meld_part')">meld</span>
                      <span x-show="(card.related_parts || []).every(p => p.component === 'token')">tokens</span>
                      <span x-show="!(card.related_parts || []).some(p => p.component === 'meld_result' || p.component === 'meld_part') && !(card.related_parts || []).every(p => p.component === 'token')">rel.</span>
                    </span>
                    <span x-show="addingRelated === card.id">…</span>
                  </button>
                </div>
              </div>

              <div class="flex flex-col items-end justify-center gap-1 shrink-0" @click.stop>
                <div class="flex items-center gap-0.5">
                  <button @click="openArtPicker(card)"
                          class="p-1 rounded hover:bg-accent/15 text-fg-muted hover:text-accent transition"
                          title="{{ t.deck_card_change_art }}">
                    <i data-lucide="image" class="w-3.5 h-3.5"></i>
                  </button>
                  <button @click="changeQty(card, card.quantity - 1)" :disabled="card.quantity <= 1"
                          class="p-1 rounded hover:bg-bg-base text-fg-muted hover:text-fg disabled:opacity-30"
                          title="{{ t.deck_card_less }}">
                    <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                  </button>
                  <button @click="changeQty(card, card.quantity + 1)"
                          class="p-1 rounded hover:bg-bg-base text-fg-muted hover:text-fg"
                          title="{{ t.deck_card_more }}">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <div class="flex items-center gap-0.5">
                  <button @click="toggleInclude(card)"
                          :class="card.include ? 'text-fg-muted hover:text-amber-400' : 'text-fg-faint hover:text-green-400'"
                          class="p-1 rounded hover:bg-bg-base transition"
                          :title="card.include ? '{{ t.deck_card_exclude }}' : '{{ t.deck_card_include }}'">
                    <i data-lucide="eye-off" class="w-3.5 h-3.5" x-show="card.include"></i>
                    <i data-lucide="eye" class="w-3.5 h-3.5" x-show="!card.include"></i>
                  </button>
                  <div x-data="{ open: false }" @click.outside="open = false" class="relative">
                    <button @click="open = !open"
                            class="p-1 rounded hover:bg-accent/15 text-fg-muted hover:text-accent transition"
                            title="{{ t.deck_card_move }}">
                      <i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i>
                    </button>
                    <div x-show="open" x-transition
                         class="absolute right-0 top-full mt-1 z-30 bg-bg-elevated border border-border-strong
                                rounded-md shadow-lg py-1 min-w-[10rem]">
                      <div class="text-[10px] uppercase tracking-wider text-fg-faint px-3 py-1">{{ t.deck_card_move_to }}</div>
                      <template x-for="opt in [
                        {role:'commander', label:'{{ t.deck_role_commander }}'},
                        {role:'mainboard', label:'{{ t.deck_role_mainboard }}'},
                        {role:'sideboard', label:'{{ t.deck_role_sideboard }}'},
                        {role:'maybeboard', label:'{{ t.deck_role_maybeboard }}'},
                        {role:'companion', label:'{{ t.deck_role_companion }}'},
                      ]" :key="opt.role">
                        <button x-show="opt.role !== card.role"
                                @click="moveCardTo(card, opt.role); open = false"
                              class="w-full text-left text-xs px-3 py-1.5 hover:bg-bg-subtle text-fg-muted hover:text-fg transition flex items-center gap-2">
                          <span x-text="opt.label"></span>
                        </button>
                      </template>
                    </div>
                  </div>
                  <button @click="deleteCard(card)"
                          class="p-1 rounded hover:bg-red-500/20 text-fg-faint hover:text-red-400 transition"
                          title="{{ t.deck_card_delete }}">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>

            </div>
          </template>
          </div>
          </div>
        </div>
      </template>
    </div>
  </div>

</div>
